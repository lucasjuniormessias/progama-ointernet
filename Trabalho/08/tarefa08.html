<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pagamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Sistema de Pagamentos</h1>

        <label>Nível do professor:</label>

        <select id="nivel">
            <option value="1">Nível 1</option>
            <option value="2">Nível 2</option>
            <option value="3">Nível 3</option>
        </select>

        <label>Quantidade de horas/aula na semana:</label>

        <input type="number" id="aulas" placeholder="Digite a quantidade">

        <button onclick="calcular()">Calcular Salário</button>

        <h2 id="resultado"></h2>

    </div>

    <script src="script.js"></script>
</body>
</html>
